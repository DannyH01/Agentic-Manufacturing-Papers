query_families:
  general_agentic_manufacturing: '((all:"agentic AI" OR all:"LLM agent" OR all:"multi-agent system" OR all:"autonomous agent" OR all:"tool-using agent" OR all:"agentic framework") AND (all:manufacturing OR all:"smart manufacturing" OR all:machining OR all:CNC OR all:"additive manufacturing" OR all:assembly OR all:"industrial robot" OR all:"production planning" OR all:"digital twin"))'
  general_manufacturing_agents: '((all:agent OR all:agents OR all:"agent-based" OR all:"manufacturing agent" OR all:"factory agent" OR all:"industrial AI agent") AND (all:manufacturing OR all:"smart factory" OR all:machining OR all:CNC OR all:"job shop" OR all:"industrial robot" OR all:"additive manufacturing"))'
  manufacturing_reasoning: '((all:"large language model" OR all:LLM OR all:"foundation model") AND (all:manufacturing OR all:machining OR all:production OR all:factory) AND (all:agent OR all:planning OR all:reasoning OR all:autonomous OR all:decision OR all:tool))'
  multi_agent_manufacturing: '((all:"multi-agent" OR all:"multi agent" OR all:multiagent) AND (all:manufacturing OR all:production OR all:machining OR all:assembly OR all:factory))'
  knowledge_agents: '((all:"knowledge graph" OR all:ontology OR all:RAG OR all:"retrieval augmented generation") AND (all:"LLM agent" OR all:"AI agent" OR all:"multi-agent" OR all:"large language model") AND (all:manufacturing OR all:machining OR all:production))'
  digital_twins: '(all:"digital twin" AND (all:agent OR all:"large language model" OR all:LLM OR all:"multi-agent") AND (all:manufacturing OR all:factory OR all:machining))'
  robotics: '((all:"LLM agent" OR all:"multi-agent" OR all:"vision language model" OR all:"agentic AI") AND (all:"industrial robot" OR all:"manufacturing robot" OR all:"robotic assembly" OR all:assembly OR all:"robotic manufacturing"))'
  production_planning: '((all:LLM OR all:"LLM agent" OR all:"multi-agent" OR all:"agentic AI") AND (all:"production scheduling" OR all:"job shop scheduling" OR all:"process planning" OR all:"production planning"))'
  process_optimization: '((all:LLM OR all:"LLM agent" OR all:"multi-agent" OR all:agentic) AND (all:"process optimization" OR all:"process control" OR all:"parameter optimization" OR all:"adaptive manufacturing"))'
  quality_inspection: '((all:LLM OR all:agentic OR all:"LLM agent" OR all:"multi-agent") AND (all:inspection OR all:metrology OR all:"quality control" OR all:"quality assurance" OR all:defect) AND all:manufacturing)'
  maintenance_diagnostics: '((all:LLM OR all:"LLM agent" OR all:"multi-agent" OR all:agentic) AND (all:"predictive maintenance" OR all:diagnosis OR all:"fault diagnosis" OR all:"condition monitoring") AND (all:manufacturing OR all:machine))'
  human_ai: '((all:"human AI collaboration" OR all:"human-AI collaboration" OR all:copilot OR all:"operator assistant" OR all:"natural language interface") AND (all:manufacturing OR all:factory OR all:machining))'
  scientific_discovery: '((all:"automated scientific discovery" OR all:"agentic scientific discovery" OR all:"AI scientist" OR all:"scientific agent" OR all:"autonomous experimentation" OR all:"self-driving laboratory" OR all:"hypothesis generation" OR all:"causal discovery" OR all:"symbolic regression" OR all:"equation discovery" OR all:"Bayesian experimental design") AND (all:manufacturing OR all:materials OR all:machining OR all:industrial))'

