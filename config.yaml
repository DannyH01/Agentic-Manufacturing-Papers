categories:
  agentic_frameworks:
    title: Agentic Manufacturing Frameworks
    file: agentic-frameworks.md
    description: General-purpose agentic, autonomous, and multi-agent architectures for manufacturing.
    keywords: [agentic framework, agentic manufacturing, autonomous manufacturing framework, multi-agent architecture, manufacturing agent, smart manufacturing system]
  process_planning:
    title: Process Planning & Decision Making
    file: process-planning.md
    description: Agents for process planning, operation selection, routing, and manufacturing decision support.
    keywords: [process planning, operation planning, machining planning, process routing, parameter selection, decision support, engineering reasoning]
  process_optimization_control:
    title: Process Optimization & Control
    file: process-optimization-control.md
    description: Agentic process optimization, adaptive control, and autonomous process adjustment.
    keywords: [process optimization, parameter optimization, process control, adaptive control, closed-loop, closed loop, autonomous process adjustment]
  production_planning_scheduling:
    title: Production Planning & Scheduling
    file: production-planning-scheduling.md
    description: Production planning, factory scheduling, resource allocation, and coordination agents.
    keywords: [production planning, production scheduling, job shop, job-shop, factory scheduling, resource allocation, supply coordination]
  monitoring_diagnostics_maintenance:
    title: Monitoring, Diagnostics & Maintenance
    file: monitoring-diagnostics-maintenance.md
    description: Intelligent monitoring, fault diagnosis, root-cause analysis, and predictive maintenance.
    keywords: [predictive maintenance, condition monitoring, fault diagnosis, root cause, root-cause, machine diagnostics, process monitoring, machine monitoring]
  quality_inspection_metrology:
    title: Quality, Inspection & Metrology
    file: quality-inspection-metrology.md
    description: Agentic quality assurance, inspection, defect analysis, and metrology.
    keywords: [quality control, quality assurance, inspection, metrology, defect detection, defect analysis, dimensional inspection, manufacturing quality]
  robotics_autonomous_manufacturing:
    title: Robotics & Autonomous Manufacturing
    file: robotics-autonomous-manufacturing.md
    description: Industrial robotics, robotic assembly, manipulation, and autonomous manufacturing cells.
    keywords: [industrial robot, manufacturing robot, robotic assembly, manipulation, robot planning, autonomous cell, human-robot collaboration]
  digital_twins_simulation:
    title: Digital Twins & Simulation
    file: digital-twins-simulation.md
    description: Manufacturing digital twins, agent-driven simulation, and virtual commissioning.
    keywords: [digital twin, virtual manufacturing, virtual commissioning, simulation agent, agent-driven simulation, machine tool twin]
  knowledge_manufacturing_intelligence:
    title: Knowledge & Manufacturing Intelligence
    file: knowledge-manufacturing-intelligence.md
    description: Manufacturing knowledge graphs, ontologies, RAG systems, and domain assistants.
    keywords: [knowledge graph, ontology, retrieval augmented, retrieval-augmented, RAG, knowledge agent, manufacturing knowledge, domain assistant]
  human_ai_collaboration:
    title: Human-AI Collaboration
    file: human-ai-collaboration.md
    description: Manufacturing copilots, operator assistants, and human-in-the-loop intelligent systems.
    keywords: [human-AI, human AI, copilot, operator assistant, natural language interface, human-in-the-loop, engineer-AI]
  design_manufacturing_engineering:
    title: Design & Manufacturing Engineering
    file: design-manufacturing-engineering.md
    description: Agentic CAD/CAM, design-for-manufacturing, toolpath, and engineering workflows.
    keywords: [CAD, CAM, CAD/CAM, design for manufacturing, DFM, toolpath, manufacturing design, engineering workflow]
  scientific_discovery:
    title: Scientific Discovery & Experimentation
    file: scientific-discovery.md
    description: Autonomous experimentation and scientific discovery methods relevant to manufacturing and materials.
    keywords: [autonomous experimentation, scientific discovery, AI scientist, hypothesis generation, hypothesis testing, hypothesis falsification, causal discovery, symbolic regression, equation discovery, experimental design, self-driving laboratory]

